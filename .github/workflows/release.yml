name: release

# Builds the single x86_64 Mavericks OpenSSH product on a modern Apple-Silicon runner (cross-built,
# targets 10.9). Three entry points:
#   - push to main   : build; if the current upstream (UPSTREAM_VERSION) has no release yet,
#                       auto-cut <upstream>-mavericks.1 (build/version.sh auto -> RELEASE=yes)
#   - a *-mavericks.* tag : publish that exact version
#   - workflow_dispatch with local_release=true : cut a local <upstream>-mavericks.(N+1) repackage
# Two pkgs ship: the PRODUCT pkg (/usr/local OpenSSH + Sparkle updater .app, 10.9.5 floor) and the
# system-REPLACEMENT pkg (backup + symlink activation). The PRODUCT pkg is EdDSA-signed and drives a
# single Sparkle appcast.xml served from releases/latest/download/appcast.xml (this is a one-line
# product, so there is no per-line feed release). Publishing is the shared publish-release.yml, which
# mints the tag itself (no PAT) and refuses an empty Release body. No 10.9 runner anywhere; the
# published artifacts are re-validated on a real 10.9 box out-of-band (tests/smoke-mavericks.sh).

on:
  push:
    branches: [main]          # push to main: build; if upstream has no release yet, cut it
    tags: ['*-mavericks.*']   # a version tag publishes that exact version
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) release for the current upstream version"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # Apple Silicon (arm64), cross-builds for 10.9; use macos-15 if 26 is unavailable
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build/version.sh counts existing <upstream>-mavericks.* tags

      - name: Install mavericks-shipyard
        # shipyard installs itself via its own action: the pkg, which puts shipyard-cmake on PATH and
        # exports $SHIPYARD_SCRIPTS. We do NOT clone or build it by hand. @v1 is the moving major tag;
        # Renovate's github-actions manager tracks it.
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Install gnupg (OpenSSH upstream PGP verification)
        run: brew install gnupg

      # Decide the whole release plan ONCE: the FULL version, the tag, and whether this run publishes.
      # VERSION is written locally (never committed) because the package scripts read it. PRs and
      # non-main branches force release=no so they can never publish or touch secrets.
      - name: Derive version + release plan
        id: ver
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A version tag publishes exactly itself.
            full="$GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
            rel=yes
          else
            mode=auto
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              mode=local
            fi
            sh build/derive-upstream-version.sh
            out="$(sh build/version.sh "$mode")"
            full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            tag="$(printf '%s\n' "$out" | sed -n 's/^TAG=//p')"
            rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            # Only main cuts releases; PRs and other branches never publish.
            [ "$GITHUB_REF_NAME" = main ] || rel=no
          fi
          printf '%s\n' "$full" > VERSION
          publish=false; [ "$rel" = yes ] && publish=true
          {
            echo "full=$full"
            echo "tag=$tag"
            echo "release=$rel"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version=$full tag=$tag release=$rel publish=$publish"

      - name: Build OpenSSH (staged)
        run: |
          export STAGE="$RUNNER_TEMP/staging"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          sh build/build-openssh.sh

      - name: Compat guard (equivalence gate)
        run: STAGE="$STAGE" sh tests/compat-guard.sh

      - name: Build updater .app
        run: shipyard-cmake --preset cross && shipyard-cmake --build build/updater --target OpenSSHUpdater

      - name: Package product pkg
        run: OUT="$PWD/dist" STAGE="$STAGE" sh build/package-pkg.sh

      - name: Package replacement pkg
        run: OUT="$PWD/dist" sh build/package-replace-pkg.sh

      - name: Run repo tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # Generate the single notes file ONCE, before it has two consumers: the appcast's <description>
      # (next step) and the release body, which travels IN the artifact because publish-release.yml
      # does not check out the repo (dist/RELEASE_NOTES.md is uploaded below with the rest of dist/*).
      # Same bytes, same file, read twice -- so the Release page and Sparkle tell one story.
      - name: Generate release notes
        if: steps.ver.outputs.release == 'yes'
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.tag }}" --version "${{ steps.ver.outputs.full }}" \
            --product OpenSSH --min-os 10.9.5 --out dist/RELEASE_NOTES.md

      # Sign the PRODUCT pkg + render the single appcast.xml -- only when this run publishes. Fork PRs
      # resolve release=no, so they never reach this step and never touch secrets. The enclosure points
      # at the release-asset download URL; the feed itself is served from releases/latest/download.
      - name: EdDSA-sign product pkg + render appcast
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth
        run: |
          set -eu
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          [ -d "$SHIPYARD_SCRIPTS" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          VER="${{ steps.ver.outputs.full }}"; TAG="${{ steps.ver.outputs.tag }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          PKG="$(ls dist/OpenSSH-*.pkg | grep -v System-Replace | head -1)"
          [ -n "$PKG" ] || { echo "::error::no product pkg in dist/"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Mavericks OpenSSH" --version "$VER" \
            --pkg-url "$base/$(basename "$PKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$PKG" --min-os 10.9.5 > dist/appcast.xml
          echo "=== appcast.xml ==="; cat dist/appcast.xml

      # Conformance: do the artifacts we are about to publish agree with each other and with the
      # family? Each piece is checked somewhere already -- the compat guard reads binaries,
      # set_install_floor stamps a floor, sign_and_appcast signs -- but nothing asserted they agree.
      # Gated like the signing step and run AFTER it: the checker cross-validates appcast<->pkg<->asset
      # and reads the fact stream on STDIN (a positional dist arg is ignored), so it needs the rendered
      # dist/appcast.xml. The floor-less product pkg's minimum lives in that appcast.
      - name: Artifact conformance
        if: steps.ver.outputs.release == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ steps.ver.outputs.full }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      # Behavior gate: a client on the previous release must SEE this as an upgrade -- a numeric
      # sparkle:version ordering strictly after the last published *-mavericks.N tag. This single-line
      # product has one tag line, so no --upstream-glob is needed (the script defaults to *-mavericks.*).
      - name: Assert appcast upgradeable
        if: steps.ver.outputs.release == 'yes'
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/appcast.xml --version "${{ steps.ver.outputs.full }}"

      - uses: actions/upload-artifact@v7
        with:
          name: openssh-dist
          path: dist/*

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'true')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ModernMavericks/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: openssh-dist
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ModernMavericks/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: openssh-dist
